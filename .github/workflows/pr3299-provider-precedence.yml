name: PR3299 Provider Precedence Patcher

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'DaBear987'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply provider precedence fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('rust/crates/rusty-claude-cli/src/main.rs')
          text = path.read_text()

          marker = "struct AnthropicRuntimeClient {"
          helper = r'''fn explicit_provider_kind_for_model(
              model: &str,
              persisted_model: &str,
          ) -> Option<api::ProviderConfigKind> {
              let resolved_model = api::resolve_model_alias(model);
              let persisted_resolved = api::resolve_model_alias(persisted_model);

              if resolved_model.eq_ignore_ascii_case(&persisted_resolved) {
                  return None;
              }

              let namespace = model
                  .trim()
                  .split_once('/')
                  .map(|(namespace, _)| namespace.to_ascii_lowercase());

              match namespace.as_deref() {
                  Some("anthropic") => Some(api::ProviderConfigKind::Anthropic),
                  Some("xai") => Some(api::ProviderConfigKind::Xai),
                  Some("openai") | Some("local") => Some(api::ProviderConfigKind::OpenAi),
                  Some("dashscope") | Some("qwen") | Some("kimi") => {
                      Some(api::ProviderConfigKind::DashScope)
                  }
                  _ => {
                      let lower = resolved_model.to_ascii_lowercase();
                      if lower.starts_with("qwen/") || lower.starts_with("qwen-")
                          || lower.starts_with("kimi/") || lower.starts_with("kimi-")
                      {
                          Some(api::ProviderConfigKind::DashScope)
                      } else if lower.starts_with("grok/") || lower.starts_with("grok-") {
                          Some(api::ProviderConfigKind::Xai)
                      } else if lower.starts_with("claude") || lower.starts_with("anthropic/") {
                          Some(api::ProviderConfigKind::Anthropic)
                      } else if lower.starts_with("openai/") || lower.starts_with("gpt-")
                          || lower.starts_with("local/")
                      {
                          Some(api::ProviderConfigKind::OpenAi)
                      } else {
                          None
                      }
                  }
              }
          }

          '''

          if 'fn explicit_provider_kind_for_model(' not in text:
              if marker not in text:
                  raise SystemExit('provider client anchor missing')
              text = text.replace(marker, helper + marker, 1)

          old = '''        let resolved_model = api::resolve_model_alias(&model);\n        let client = if let Some(config) = provider_config {'''
          new = '''        let resolved_model = api::resolve_model_alias(&model);\n        let provider_config = provider_config.map(|config| {\n            if let Some(kind) =\n                explicit_provider_kind_for_model(&model, config.model.as_str())\n            {\n                api::ProviderConfig {\n                    kind,\n                    model: resolved_model.clone(),\n                    ..config\n                }\n            } else {\n                config\n            }\n        });\n        let client = if let Some(config) = provider_config {'''

          if old in text and 'explicit_provider_kind_for_model(&model, config.model.as_str())' not in text:
              text = text.replace(old, new, 1)
          elif 'explicit_provider_kind_for_model(&model, config.model.as_str())' not in text:
              raise SystemExit('runtime provider construction anchor missing')

          test_marker = '''    #[test]\n    fn persisted_provider_configuration_controls_runtime_provider_dispatch() {'''
          test = r'''    #[test]
    fn explicit_model_provider_hint_overrides_persisted_provider_kind() {
        let config = api::ProviderConfig {
            kind: api::ProviderConfigKind::DashScope,
            model: "qwen-plus".to_string(),
            api_key: Some("persisted-test-key".to_string()),
            base_url: None,
        };

        assert_eq!(
            super::explicit_provider_kind_for_model("openai/gpt-5", &config.model),
            Some(api::ProviderConfigKind::OpenAi)
        );
        assert_eq!(
            super::explicit_provider_kind_for_model("qwen-plus", &config.model),
            None,
            "matching persisted model must keep the persisted provider kind"
        );
    }

    #[test]
    fn explicit_model_provider_hint_controls_runtime_provider_dispatch() {
        let config_home = temp_dir();
        let workspace = temp_dir();
        fs::create_dir_all(&config_home).expect("config home");
        fs::create_dir_all(&workspace).expect("workspace");

        let provider_config = api::ProviderConfig {
            kind: api::ProviderConfigKind::DashScope,
            model: "qwen-plus".to_string(),
            api_key: Some("persisted-test-key".to_string()),
            base_url: None,
        };

        let runtime = super::AnthropicRuntimeClient::new(
            "provider-resolution-explicit-model-test",
            "openai/gpt-5".to_string(),
            false,
            false,
            None,
            GlobalToolRegistry::builtin(),
            None,
            Some(provider_config),
        )
        .expect("runtime client should construct from explicit model provider hint");

        match runtime.client {
            api::ProviderClient::OpenAi(client) => {
                assert!(client.base_url().contains("api.openai.com"));
                assert!(!client.base_url().contains("dashscope.aliyuncs.com"));
            }
            other => panic!(
                "explicit OpenAI model prefix must override persisted DashScope configuration, got {other:?}"
            ),
        }

        let _ = fs::remove_dir_all(config_home);
        let _ = fs::remove_dir_all(workspace);
    }

'''

          if 'explicit_model_provider_hint_controls_runtime_provider_dispatch' not in text:
              if test_marker not in text:
                  raise SystemExit('runtime precedence test anchor missing')
              text = text.replace(test_marker, test + test_marker, 1)

          path.write_text(text)
          PY

      - name: Format
        run: cargo fmt --all -- --check

      - name: Run targeted tests
        run: |
          cargo test -p api persisted_provider_kind_overrides_model_provider_detection
          cargo test -p runtime loads_persisted_provider_configuration_from_settings
          cargo test -p rusty-claude-cli explicit_model_provider_hint

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'DaBear987'
          git config user.email '197504317+DaBear987@users.noreply.github.com'
          git add rust/crates/rusty-claude-cli/src/main.rs
          git commit -m 'fix: honor explicit model provider over persisted config'
          git push origin HEAD:main
