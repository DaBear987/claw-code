name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: rust

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Apply PR3299 provider precedence fix
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      working-directory: .
      run: python3 scripts/pr3299_provider_precedence_fix.py
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Commit verified PR3299 fix and cleanup
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      working-directory: .
      run: |
        git config user.name 'DaBear987'
        git config user.email '197504317+DaBear987@users.noreply.github.com'
        python3 - <<'PY'
        from pathlib import Path
        path = Path('.github/workflows/rust.yml')
        path.write_text('''name: Rust\n\non:\n  push:\n    branches: [ "main" ]\n  pull_request:\n    branches: [ "main" ]\n\nenv:\n  CARGO_TERM_COLOR: always\n\ndefaults:\n  run:\n    working-directory: rust\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n\n    steps:\n    - uses: actions/checkout@v4\n    - name: Build\n      run: cargo build --verbose\n    - name: Run tests\n      run: cargo test --verbose\n''')
        Path('.github/workflows/pr3299-provider-precedence.yml').unlink(missing_ok=True)
        Path('scripts/pr3299_provider_precedence_fix.py').unlink(missing_ok=True)
        PY
        git add -A
        git commit -m 'fix: honor explicit model provider over persisted config'
        git push origin HEAD:main
