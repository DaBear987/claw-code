name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: rust

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Apply PR3299 provider precedence fix
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      working-directory: .
      run: python3 scripts/pr3299_provider_precedence_fix.py
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
