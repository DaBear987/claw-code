name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: rust

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Apply PR3299 provider precedence fix
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      working-directory: .
      run: python3 scripts/pr3299_provider_precedence_fix.py
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Export verified provider precedence source
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: pr3299-provider-precedence-source-${{ github.sha }}
        path: |
          rust/crates/rusty-claude-cli/src/main.rs
          /home/runner/work/claw-code/claw-code/rust/crates/rusty-claude-cli/src/main.rs
        if-no-files-found: error
